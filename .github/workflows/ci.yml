name: "[CMake] Project configuration, build and testing"
run-name: ${{ github.actor }} has done ${{ github.event_name }} to master branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      CMAKE_GENERATOR: /usr/bin/ninja
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        build_type: [ Release, Debug ]
        conan_preset: [ conan-release, conan-debug ]
    steps:
    - run: echo "Running on ${{ matrix.os }}"
    - name: Cloning git repository
      uses: actions/checkout@v4

    - name: Setup C++ compiler
      uses: aminya/setup-cpp@v1
      with:
        compiler: llvm
        cmake: true
        conan: true
        ninja: true

    - name: Setup conan profile
      run: conan profile detect --force

    - name: Install all required dependencies
      run: conan install . -s:a build_type=${{ matrix.build_type }} -s:a compiler.cppstd=23 --build=missing

    - name: CMake configuration phase (Ubuntu/macOS)
      if: ${{ matrix.os != windows-latest }}
      run: cmake --preset conan-release

    - name: CMake configuration phase (Windows)
      if: ${{ matrix.os == windows-latest }}
      run: cmake --preset conan-default

    - name: CMake build phase
      run: cmake --build --preset ${{ matrix.conan_preset }}

    - name: CMake test phase
      run: ctest --preset ${{ matrix.conan_preset }}
